# ------------------------------------------------------------------------------
# Visual Node-Based Trigger Graph (`TriggerGraphDef`)
# ------------------------------------------------------------------------------
[[trigger_graphs]]
id = "citadel_match_director"
name = "Citadel Sanctum Initialization & Vision Reveal"
enabled = true

[[trigger_graphs.groups]]
id = "grp_opening"
title = "Opening Sanctum Sequence"
comment = "Reveals the central relic sanctum and marks control obelisks active shortly after match start."
canvas_rect = [40.0, 40.0, 920.0, 260.0]

[[trigger_graphs.nodes]]
id = "node_match_start"
title = "On Match Start"
group_id = "grp_opening"
canvas_pos = [80.0, 120.0]
node_kind = { kind = "event_start", event = { event = "match_start" }, once = true }

[[trigger_graphs.nodes]]
id = "node_intro_delay"
title = "Wait 0.5s"
group_id = "grp_opening"
canvas_pos = [300.0, 120.0]
node_kind = { kind = "delay", delay_secs = 0.5, repeat_count = 0, repeat_interval_secs = 0.0 }

[[trigger_graphs.nodes]]
id = "node_gate_ready"
title = "Sanctum Gate (AND)"
group_id = "grp_opening"
canvas_pos = [510.0, 120.0]
node_kind = { kind = "logic_gate", gate = { op = "and" } }

[[trigger_graphs.nodes]]
id = "node_set_sanctum_var"
title = "Mark Sanctums Active"
group_id = "grp_opening"
canvas_pos = [720.0, 80.0]
node_kind = { kind = "action", action = { type = "set_variable", name = "citadel_sanctums_online", value = 1 } }

[[trigger_graphs.nodes]]
id = "node_reveal_center"
title = "Reveal Central Relic Sanctum"
group_id = "grp_opening"
canvas_pos = [720.0, 175.0]
node_kind = { kind = "action", action = { type = "reveal_area", player_id = 1, tile = [32, 32], radius = 8 } }

[[trigger_graphs.wires]]
id = "wire_start_to_delay"
from_node = "node_match_start"
from_port = "out"
to_node = "node_intro_delay"
to_port = "in"

[[trigger_graphs.wires]]
id = "wire_delay_to_gate"
from_node = "node_intro_delay"
from_port = "out"
to_node = "node_gate_ready"
to_port = "in"

[[trigger_graphs.wires]]
id = "wire_gate_to_var"
from_node = "node_gate_ready"
from_port = "out"
to_node = "node_set_sanctum_var"
to_port = "in"

[[trigger_graphs.wires]]
id = "wire_gate_to_reveal"
from_node = "node_gate_ready"
from_port = "out"
to_node = "node_reveal_center"
to_port = "in"
