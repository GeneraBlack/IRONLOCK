[workspace]
resolver = "2"
members = [
    "crates/rts-sdk",
    "crates/rts-asset-pipeline",
    "crates/rts-simulation",
    "crates/rts-network",
    "crates/rts-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
schemars = "0.8"
semver = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
glam = { version = "0.29", features = ["serde"] }
rhai = { version = "1.21", features = ["sync"] }
flate2 = "1.0"
bevy_egui = "0.33"
egui_dock = { version = "0.16", features = ["serde"] }
bevy = { version = "0.15", default-features = false, features = [
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gltf",
    "bevy_gizmos",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "flac",
    "ktx2",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "vorbis",
    "wav",
    "wayland",
    "x11",
] }

