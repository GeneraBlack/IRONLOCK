<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link href="/cluster-admin/css/core.css" rel="stylesheet" />
    <title>IRONLOCK // RUST-RTS — NethServer 8 App</title>
    <style>
      body {
        margin: 0;
      }

      .loading-app {
        height: 100vh;
        background-color: #393939;
        color: #393939;
        text-align: center;
      }

      .loading-app .loader {
        width: 88px;
        height: 88px;
        margin-top: 4rem;
        border: 8px solid #00a2de;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 690ms linear infinite;
      }

      @keyframes rotation {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>Bitte aktiviere JavaScript für das NethServer 8 Cockpit-UI.</strong>
    </noscript>
    <div id="ns8-app" class="loading-app">
      <span class="loader"></span>
    </div>
  </body>
</html>
