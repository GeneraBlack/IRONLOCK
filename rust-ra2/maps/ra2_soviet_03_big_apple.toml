[[trigger_zones]]
id = "ra2_soviet_03_big_apple_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [66, 22], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Capture the Allied Battle Lab in Manhattan to erect our Psychic Beacon and crush the Allied divisions defending New York.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_soviet_03_big_apple_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rhino_tank", count = 3, tile = [21, 49] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "reinforcements_have_arrived" },
]

[[trigger_zones]]
id = "battle_lab_captured_nyc"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "allied_battle_lab", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "spawn_building", player_id = 1, building_id = "psychic_beacon", tile = [25, 43] },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "set_objective", text = "Psychic Beacon deployed! Defend the Beacon and crush the remaining Allied forces in Manhattan." },
    { type = "eva_transmission", speaker = "YURI", text = "Allied Battle Lab schematics acquired! Our Psychic Beacon is rising over Manhattan!", portrait = "assets/ui/cameos/yuriicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_soviet_03_big_apple_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

