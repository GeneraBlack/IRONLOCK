[[trigger_zones]]
id = "bootcamp_02_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "active" },
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "start_countdown", timer_id = "bootcamp_holdout", label = "Perimeter Holdout", duration_secs = 120 },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "Day 2 Live-Fire Exercise! Deploy your MCV, construct Power, Refinery, and War Factory, and brace for the simulated Soviet attack wave!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "bootcamp_02_opfor_wave"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 40.0 }
actions = [
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "spawn_reinforcements", player_id = 2, unit_id = "soviet_conscript", count = 4, tile = [29, 20] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "grizzly_tank", count = 3, tile = [14, 36] },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "set_objective", text = "Repel the OPFOR wave and lead your Grizzly Tank column northeast to destroy the simulated Soviet base." },
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "OPFOR wave advancing! Three additional Grizzly Battle Tanks have joined you — crush their attack and counter-push!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "reinforcements_have_arrived" },
]

[[trigger_zones]]
id = "bootcamp_02_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "player_units_below", player_id = 1, max_count = 0 }
actions = [
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "All field forces lost! Restarting base defense drill.", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "bootcamp_02_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Congratulations on graduating Bootcamp, Commander! Report to the Pentagon — the Soviets are invading for real!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_holdout_expired"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "countdown_expired", timer_id = "bootcamp_holdout" }
actions = [
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [14, 36] },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Perimeter Holdout succeeded! Heavy armored reinforcements have arrived on the battlefield!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "primary_objective_achieved" },
]

[[trigger_zones]]
id = "p22_tech_comms_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_communications_center", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 1000 },
    { type = "reveal_area_for_player", player_id = 1, center = [69.0, 0.0, 21.0], radius = 24.0, duration_secs = 45 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Tech Communications Center online! Satellite radar sweep active.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "soviet_conscript", count = 2, tile = [32, 8] },
    { type = "add_objective_progress", objective_id = "obj_bonus_waves", delta = 1 },
]
