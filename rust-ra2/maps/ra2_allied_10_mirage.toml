[[trigger_zones]]
id = "ra2_allied_10_mirage_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_einstein", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "start_countdown", timer_id = "einstein_holdout", label = "Einstein Lab Defense", duration_secs = 180 },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [36, 20], radius = 9 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Defend Professor Einstein's Black Forest Laboratory at all costs using Mirage Tanks and crush the three Soviet tank divisions.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_allied_10_mirage_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_10_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [57, 65] },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_10_pip_02.mp4" },
]

[[trigger_zones]]
id = "ra2_allied_10_mirage_protect_fail"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "einstein_lab" }
actions = [
    { type = "eva_transmission", speaker = "LT. EVA", text = "Critical structure lost! Mission failed.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "ra2_allied_10_mirage_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_einstein", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_einstein_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "einstein" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_einstein", status = "failed" },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Critical protected asset (einstein) has been destroyed!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "p22_holdout_expired"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "countdown_expired", timer_id = "einstein_holdout" }
actions = [
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [58, 67] },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Einstein Lab Defense succeeded! Heavy armored reinforcements have arrived on the battlefield!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "primary_objective_achieved" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "soviet_conscript", count = 3, tile = [34, 18] },
    { type = "add_objective_progress", objective_id = "obj_bonus_waves", delta = 1 },
]
