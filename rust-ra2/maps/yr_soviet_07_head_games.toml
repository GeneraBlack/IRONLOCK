[[trigger_zones]]
id = "yr_soviet_07_head_games_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_boris", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_weather", preset = "night" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [28, 28], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Shatter the twin Psychic Beacons guarding Transylvania and raze Yuri's ancestral Castle Fortress once and for all!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "yr_soviet_07_head_games_stage2_reinf"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 60.0 }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/yr_soviet_07_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "apocalypse_tank", count = 2, tile = [51, 81] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Heavy armored reinforcements have arrived at the staging area!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/yr_soviet_07_pip_02.mp4" },
]

[[trigger_zones]]
id = "yr_soviet_07_head_games_target_down"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "transylvania_fortress", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Key Psi-Corps structure destroyed! Press the assault and wipe out the rest of Yuri's base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "yr_soviet_07_head_games_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_boris", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Yuri's forces in this sector have been completely eradicated! Victory is ours!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_boris_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "boris" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_boris", status = "failed" },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Hero Boris has fallen in combat!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "unit_lost" },
]

