[[trigger_zones]]
id = "mission_stage_init"
min = [6, 6]
max = [12, 12]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "eva_transmission", speaker = "ZOFIA", text = "Battle Control Online. Primary tactical objectives initialized." },
    { type = "reveal_area", tile = [40, 16], radius = 14 }
]

[[trigger_zones]]
id = "tactical_reinforcement_wave"
min = [39, 14]
max = [43, 18]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 45.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "apocalypse_tank", count = 2, tile = [39, 14] },
    { type = "grant_credits", player_id = 1, amount = 1500 },
    { type = "eva_transmission", speaker = "ZOFIA", text = "Reinforcements have arrived. Forward command has authorized 1500 bonus credits." }
]

[[trigger_zones]]
id = "decisive_campaign_victory"
min = [2, 2]
max = [6, 6]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "ZOFIA", text = "Mission Accomplished. All primary hostile command structures neutralized." },
    { type = "declare_winner", player_id = 1 }
]
