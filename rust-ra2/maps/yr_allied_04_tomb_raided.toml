[[trigger_zones]]
id = "yr_allied_04_tomb_raided_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [72, 16], radius = 9 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Send Tanya to the Great Pyramid of Giza to free Professor Einstein and obliterate Yuri's Nile stronghold.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "einstein_pyramid_rescue"
min = [44, 36]
max = [53, 45]
once = true
condition = { type = "entered_zone", player_id = 1 }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/yr_allied_04_pip_03.mp4" },
    { type = "set_variable", name = "einstein_rescued", value = 1 },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [45, 44] },
    { type = "eva_transmission", speaker = "PROF. EINSTEIN", text = "Ach, thank you Agent Tanya! Take my Prism Tank prototypes and flatten Yuri's Giza base!", portrait = "assets/ui/cameos/einstein_lab.png", audio_cue = "battle_control_online", radar_video = "assets/videos/radar_pip/yr_allied_04_pip_03.mp4" },
]

[[trigger_zones]]
id = "yr_allied_04_tomb_raided_protect_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "great_pyramid" }
actions = [
    { type = "eva_transmission", speaker = "LT. EVA", text = "Critical landmark destroyed! Mission failed.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "yr_allied_04_tomb_raided_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Yuri's forces in this sector have been completely eradicated! Victory is ours!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_tanya_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "tanya" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "failed" },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Agent Tanya has fallen in combat!", portrait = "assets/ui/cameos/tanyicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "p22_bonus_tech_captured"
