    { type = "eva_transmission", speaker = "LT. EVA", text = "Warning: Nuclear Silo Launch Prep reached zero! Enemy heavy armor strike group deployed!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "base_under_attack" },
]

[[trigger_zones]]
