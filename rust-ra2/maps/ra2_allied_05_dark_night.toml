[[trigger_zones]]
id = "dark_night_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "start_countdown", timer_id = "silo_launch_prep", label = "Nuclear Silo Launch Prep", duration_secs = 240 },
    { type = "set_weather", preset = "night" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [28, 49], radius = 8 },
    { type = "eva_transmission", speaker = "GEN. VON ESLING", text = "Use Allied Spies to shut down Tesla Reactors and infiltrate the Soviet Battle Lab, then send Tanya to C4 both Nuclear Missile Silos!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "battle_lab_recon_zone"
min = [23, 44]
max = [34, 55]
once = true
condition = { type = "entered_zone", player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "stop_countdown", timer_id = "silo_launch_prep" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_05_pip_02.mp4" },
    { type = "set_variable", name = "silos_located", value = 1 },
    { type = "reveal_area", tile = [18, 18], radius = 10 },
    { type = "reveal_area", tile = [15, 31], radius = 10 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "navy_seal", count = 3, tile = [12, 82] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "chrono_legionnaire", count = 2, tile = [14, 82] },
    { type = "set_objective", text = "Both Soviet Nuclear Missile Silos revealed! Destroy every Soviet Nuclear Silo before launch." },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Nuclear Silo coordinates downloaded! Chrono Legionnaires and SEALs have reinforced your strike team.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_05_pip_02.mp4" },
]

[[trigger_zones]]
id = "commando_team_lost_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "player_units_below", player_id = 1, max_count = 0 }
actions = [
    { type = "eva_transmission", speaker = "GEN. VON ESLING", text = "Tanya's infiltration team has been wiped out! Europe will never join us now.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "dark_night_silos_destroyed_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "soviet_nuclear_silo", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "completed" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_05_pip_03.mp4" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "GEN. VON ESLING", text = "Both Soviet Nuclear Silos are destroyed! Germany, France, and Great Britain formally join the Allied cause!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "primary_objective_achieved", radar_video = "assets/videos/radar_pip/allied_05_pip_03.mp4" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_tanya_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "tanya" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "failed" },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Agent Tanya has fallen in combat!", portrait = "assets/ui/cameos/tanyicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "p22_crisis_countdown_expired"
