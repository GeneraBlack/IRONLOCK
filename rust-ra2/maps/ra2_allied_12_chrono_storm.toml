[[trigger_zones]]
id = "ra2_allied_12_chrono_storm_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_weather", preset = "ion_storm" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [42, 22], radius = 9 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Expand your Chrono-teleported foothold in Moscow, breach the Black Guard's Iron Curtain & Apocalypse perimeter, and neutralize the Kremlin stronghold.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_allied_12_chrono_storm_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_12_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [17, 77] },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_12_pip_02.mp4" },
]

[[trigger_zones]]
id = "ra2_allied_12_chrono_storm_key_target_down"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "kremlin_palace", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "set_variable", name = "primary_target_destroyed", value = 1 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Primary enemy strategic structure destroyed! Sweep the remaining enemy forces from the sector.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_allied_12_chrono_storm_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

