[[trigger_zones]]
id = "eagle_dawn_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "active" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "active" },
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [32, 29], radius = 9 },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Fly your Rocketeers to knock out Flak Cannons and escort Tanya into the Air Force Academy to reclaim our base!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "academy_liberated"
min = [27, 24]
max = [41, 35]
once = true
condition = { type = "entered_zone", player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "completed" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_02_pip_02.mp4" },
    { type = "change_owner", from_player_id = 3, to_player_id = 1 },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "harrier", count = 2, tile = [33, 25] },
    { type = "set_objective", text = "Air Force Academy liberated! Build Grizzly Tanks and Harriers and wipe out the Soviet occupation base." },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Air Force Academy and Airforce Command HQ are back online!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online", radar_video = "assets/videos/radar_pip/allied_02_pip_02.mp4" },
]

[[trigger_zones]]
id = "chapel_lost_defeat"
min = [0, 0]
max = [3, 3]
