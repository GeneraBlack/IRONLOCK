[[trigger_zones]]
id = "ra2_allied_11_fallout_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "start_countdown", timer_id = "cuban_nuke_timer", label = "Cuban Nuclear Strike Window", duration_secs = 240 },
    { type = "set_weather", preset = "dusk" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [70, 74], radius = 9 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Protect the Allied Chronosphere in the Florida Keys, neutralize Cuba's three Nuclear Missile Silos, and sink the Soviet naval blockade.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_allied_11_fallout_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_11_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [37, 37] },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_11_pip_02.mp4" },
]

[[trigger_zones]]
