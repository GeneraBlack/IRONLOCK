[[trigger_zones]]
id = "paris_briefing_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [20, 19], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Cross the Seine, capture the Eiffel Tower intact with a Soviet Engineer, and guard it as its Tesla arc devastates the French garrison!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "eiffel_tower_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "eiffel_tower", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/soviet_05_pip_02.mp4" },
    { type = "set_variable", name = "eiffel_energized", value = 1 },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "tesla_trooper", count = 4, tile = [20, 24] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rhino_tank", count = 3, tile = [29, 43] },
    { type = "set_objective", text = "Protect the energized Eiffel Tower and destroy all remaining Allied buildings in Paris." },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "The Eiffel Tower is fully energized! Massive Tesla bolts are sweeping Paris — finish off the Allied base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online", radar_video = "assets/videos/radar_pip/soviet_05_pip_02.mp4" },
]

[[trigger_zones]]
id = "french_counterattack_wave"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "variable_equals", name = "eiffel_energized", value = 1 }, { type = "timer_elapsed", secs = 75.0 }] }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "grizzly_tank", count = 3, tile = [12, 18] },
    { type = "spawn_reinforcements", player_id = 2, unit_id = "mirage_tank", count = 2, tile = [14, 18] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Allied Mirage and Grizzly Tanks are counterattacking toward Champ de Mars! Defend the Tower!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "base_under_attack" },
]

[[trigger_zones]]
id = "eiffel_tower_destroyed_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "eiffel_tower" }
actions = [
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "The Eiffel Tower has been destroyed! Our Parisian Tesla weapon is lost — mission failed.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "paris_total_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "building_captured", building_id = "eiffel_tower", by_player_id = 1 }, { type = "all_buildings_destroyed", player_id = 2 }] }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "PREMIER ROMANOV", text = "City of Lights indeed! Paris shines brightly under Soviet Tesla power!", portrait = "assets/ui/cameos/soviet_conyard.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_bonus_tech_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_oil_derrick", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 750 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Bonus objective achieved: Neutral tech structure secured!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "allied_gi", count = 3, tile = [8, 8] },
]
