    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [64, 68], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Sink Yuri's Boomer Submarine pack off Easter Island, breach the Moai defense line, and raze Yuri's Submarine Pens and launch complex.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

