[[trigger_zones]]
id = "romanov_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "active" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_boris", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_romanov", status = "active" },
    { type = "set_objective_status", objective_id = "obj_romanov_evac", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [42, 52], radius = 8 },
    { type = "reveal_area", tile = [58, 7], radius = 8 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Premier Romanov is hiding in the eastern Moroccan casbah! Fight through Yuri's patrols with Boris to reach him!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "romanov_rescued_zone"
min = [36, 47]
max = [48, 58]
once = true
condition = { type = "entered_zone", player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "completed" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/yr_soviet_04_pip_02.mp4" },
    { type = "change_owner", from_player_id = 3, to_player_id = 1 },
    { type = "set_variable", name = "romanov_rescued", value = 1 },
    { type = "grant_credits", player_id = 1, amount = 3000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rhino_tank", count = 3, tile = [40, 56] },
    { type = "set_objective", text = "Premier Romanov rescued! Deploy your MCV, capture Marrakech Airport, and destroy Yuri's airfield stronghold." },
    { type = "eva_transmission", speaker = "PREMIER ROMANOV", text = "Well done, General! Take my mobile command vehicle and crush Yuri's forces blocking Marrakech Airport!", portrait = "assets/ui/cameos/soviet_conyard.png", audio_cue = "battle_control_online", radar_video = "assets/videos/radar_pip/yr_soviet_04_pip_02.mp4" },
]

[[trigger_zones]]
id = "romanov_squad_lost_defeat"
