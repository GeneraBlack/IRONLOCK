[[trigger_zones]]
id = "lunar_landing_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_weather", preset = "night" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [19, 14], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Lunar landing successful, Comrade General! Expand our Soviet moonbase with Tesla Troopers, Flak Troopers, Desolators, and Rhino Heavy Tanks, and raze Yuri's Lunar Command!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "baikonur_lunar_drop"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 50.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/yr_soviet_06_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "tesla_trooper", count = 4, tile = [16, 82] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "flak_trooper", count = 3, tile = [18, 82] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "desolator", count = 2, tile = [20, 82] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rhino_tank", count = 3, tile = [22, 82] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Baikonur supply lander has touched down with Tesla Troopers, Flak Troopers, Desolators, and Rhino Tanks!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online", radar_video = "assets/videos/radar_pip/yr_soviet_06_pip_02.mp4" },
]

[[trigger_zones]]
id = "yuri_lunar_lab_destroyed"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "yuri_battle_lab", player_id = 2 }
actions = [
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "set_objective", text = "Yuri's Lunar Research Lab is destroyed! Wipe out his remaining Lunar Command structures." },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Yuri's primary Lunar Command Center has depressurized! Crush his remaining moon structures!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "lunar_total_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "PREMIER ROMANOV", text = "The red banner flies over the Sea of Tranquility! Now let us finish Yuri back on Earth!", portrait = "assets/ui/cameos/soviet_conyard.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "yuri_initiate", count = 3, tile = [12, 12] },
    { type = "add_objective_progress", objective_id = "obj_bonus_waves", delta = 1 },
]
