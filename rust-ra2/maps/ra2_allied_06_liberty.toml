[[trigger_zones]]
id = "ra2_allied_06_liberty_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [48, 16], radius = 9 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Reclaim Washington D.C. with European Allied reinforcements, protect the White House, and crush the Soviet occupation headquarters.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_allied_06_liberty_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_06_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "prism_tank", count = 3, tile = [70, 78] },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_06_pip_02.mp4" },
]

[[trigger_zones]]
id = "ra2_allied_06_liberty_protect_fail"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "white_house" }
actions = [
    { type = "eva_transmission", speaker = "LT. EVA", text = "Critical structure lost! Mission failed.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "ra2_allied_06_liberty_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

