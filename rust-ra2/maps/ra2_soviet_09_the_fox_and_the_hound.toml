[[trigger_zones]]
id = "fox_hound_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [32, 24], radius = 8 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "President Dugan is inside the Alamo Command Post! Watch out for Navy SEALs and Snipers — mind-control Allied patrols and capture the Alamo intact!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "san_antonio_airport_bonus"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_airport", by_player_id = 1 }
actions = [
    { type = "grant_credits", player_id = 1, amount = 1500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "soviet_engineer", count = 2, tile = [42, 18] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "tesla_trooper", count = 4, tile = [44, 18] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "San Antonio Airfield captured! Paratrooper Engineers and Shock Troopers have landed!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "psi_team_eliminated_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "player_units_below", player_id = 1, max_count = 0 }
actions = [
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "All Psi-Corps operatives have been neutralized! The President has escaped.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "alamo_destroyed_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "white_house" }
actions = [
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Fool! The Alamo Command Post was destroyed — we needed the President alive!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "president_captured_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "white_house", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "YURI", text = "The American President's mind is now ours, Comrade General. America kneels before the Union!", portrait = "assets/ui/cameos/yuriicon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_bonus_tech_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_airport", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 750 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Bonus objective achieved: Neutral tech structure secured!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "allied_gi", count = 3, tile = [42, 40] },
]
