[[trigger_zones]]
id = "bootcamp_01_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "active" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_convoy", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [19, 32], radius = 8 },
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "Welcome to Allied Tactical Bootcamp, Commander! March your GIs south to Waypoint Alpha to unlock your forward Construction Yard.", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "bootcamp_waypoint_alpha"
min = [15, 27]
max = [26, 38]
once = true
condition = { type = "entered_zone", player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "completed" },
    { type = "expand_playable_bounds", min_tile = [0, 0], max_tile = [55, 68] },
    { type = "reveal_area_for_player", player_id = 1, center = [77.0, 0.0, 105.0], radius = 22.0, duration_secs = 30 },
    { type = "change_owner", from_player_id = 3, to_player_id = 1 },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "grizzly_tank", count = 2, tile = [22, 33] },
    { type = "set_objective", text = "Build an Allied Barracks, train additional GIs, and destroy all simulated OPFOR structures in the southern range." },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Forward Training Outpost transferred to your command! Harvest Ore and clear the southern OPFOR target range.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "bootcamp_01_squad_lost_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "player_units_below", player_id = 1, max_count = 0 }
actions = [
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "All training units lost! Resetting exercise.", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "bootcamp_01_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_convoy", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "DRILL INSTRUCTOR", text = "First-rate command work, Recruit! Proceed to Day 2: Base Defense & Armored Counterattack.", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_convoy_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "convoy" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_convoy", status = "failed" },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Critical protected asset (convoy) has been destroyed!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "soviet_conscript", count = 2, tile = [36, 50] },
    { type = "add_objective_progress", objective_id = "obj_bonus_waves", delta = 1 },
]
