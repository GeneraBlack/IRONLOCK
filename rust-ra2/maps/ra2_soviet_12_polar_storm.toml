max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "allied_chronosphere", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "completed" },
    { type = "stop_countdown", timer_id = "chrono_escape_timer" },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "set_variable", name = "primary_target_destroyed", value = 1 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Primary enemy strategic structure destroyed! Sweep the remaining enemy forces from the sector.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_soviet_12_polar_storm_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
