[[trigger_zones]]
id = "ra2_soviet_12_polar_storm_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_secondary_strike", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "start_countdown", timer_id = "chrono_escape_timer", label = "Chronosphere Activation Window", duration_secs = 240 },
    { type = "set_weather", preset = "ion_storm" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [44, 62], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Storm Point Hope in Alaska, shatter the final Allied defense ring, and destroy the last Allied Chronosphere to secure global Soviet victory!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "primary_objective_achieved" },
]

[[trigger_zones]]
id = "ra2_soviet_12_polar_storm_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "apocalypse_tank", count = 3, tile = [19, 19] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "reinforcements_have_arrived" },
]

[[trigger_zones]]
id = "ra2_soviet_12_polar_storm_key_target_down"
