[[trigger_zones]]
id = "mission_stage_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "active" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [9, 40], radius = 9 },
    { type = "reveal_area", tile = [29, 16], radius = 8 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Special Agent Tanya has landed near Battery Park. Reach Fort Bradley to take command of the garrison and sink the Soviet Dreadnoughts!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "fort_bradley_contact"
min = [25, 13]
max = [37, 22]
once = true
condition = { type = "any", conditions = [{ type = "tagged_entity_entered_zone", tag = "tanya", zone_id = "fort_bradley_contact" }, { type = "entered_zone", player_id = 1 }] }
actions = [
    { type = "set_objective_status", objective_id = "obj_stage1_linkup", status = "completed" },
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_01_pip_02.mp4" },
    { type = "change_owner", from_player_id = 3, to_player_id = 1 },
    { type = "set_variable", name = "fort_contacted", value = 1 },
    { type = "grant_credits", player_id = 1, amount = 2500 },
    { type = "set_objective", text = "Construct an Allied Naval Shipyard in New York Harbor, sink the Soviet Dreadnought fleet, and raze the Soviet supply base." },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Fort Bradley is yours, Commander! Get a Naval Shipyard in the harbor and send those Dreadnoughts to the bottom!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "building_captured", radar_video = "assets/videos/radar_pip/allied_01_pip_02.mp4" },
]

[[trigger_zones]]
id = "tactical_reinforcement_wave"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 45.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/allied_01_pip_03.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 1500 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "allied_gi", count = 4, tile = [28, 24] },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rocketeer", count = 2, tile = [30, 24] },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Airborne GIs and Rocketeers have arrived to reinforce Manhattan!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/allied_01_pip_03.mp4" },
]

[[trigger_zones]]
id = "tanya_survival_defeat"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "player_units_below", player_id = 1, max_count = 0 }] }
actions = [
    { type = "eva_transmission", speaker = "LT. EVA", text = "Agent Tanya and all Allied field units have fallen! Manhattan is lost.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "lone_guardian_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "GEN. CARVILLE", text = "Outstanding work, Commander! Lady Liberty stands tall and New York Harbor is secure!", portrait = "assets/ui/cameos/allied_conyard_icon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_tanya_lost"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "tagged_entity_destroyed", tag = "tanya" }
actions = [
    { type = "set_objective_status", objective_id = "obj_vip_tanya", status = "failed" },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Agent Tanya has fallen in combat!", portrait = "assets/ui/cameos/tanyicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "p22_bonus_tech_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_oil_derrick", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 750 },
    { type = "eva_transmission", speaker = "LT. EVA", text = "Bonus objective achieved: Neutral tech structure secured!", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
