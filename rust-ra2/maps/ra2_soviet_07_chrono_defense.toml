[[trigger_zones]]
id = "ra2_soviet_07_chrono_defense_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "active" },
    { type = "set_objective_status", objective_id = "obj_vip_ural_battle_lab", status = "active" },
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_tech", status = "active" },
    { type = "start_countdown", timer_id = "chrono_holdout", label = "Ural Lab Defense", duration_secs = 180 },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [76, 60], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Defend the Soviet Battle Lab in the Ural Mountains against Chrono-teleported Allied assault waves and wipe out their forward Chrono base.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_soviet_07_chrono_defense_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/soviet_07_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "apocalypse_tank", count = 3, tile = [38, 31] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/soviet_07_pip_02.mp4" },
]

[[trigger_zones]]
id = "allied_chrono_wave_1"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 70.0 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "grizzly_tank", count = 4, tile = [47, 38] },
    { type = "spawn_reinforcements", player_id = 2, unit_id = "chrono_legionnaire", count = 2, tile = [48, 38] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Chrono vortex detected! Allied tanks have teleported onto our eastern flank — protect the Battle Lab!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "base_under_attack" },
]

[[trigger_zones]]
id = "ra2_soviet_07_chrono_defense_protect_fail"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_destroyed", building_id = "soviet_battle_lab" }
actions = [
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Critical structure lost! Mission failed.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "unit_lost" },
    { type = "declare_winner", player_id = 2 },
]

[[trigger_zones]]
id = "ra2_soviet_07_chrono_defense_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_vip_ural_battle_lab", status = "completed" },
    { type = "set_objective_status", objective_id = "obj_holdout_timer", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_vip_ural_battle_lab_lost"
