[[trigger_zones]]
id = "ra2_soviet_04_home_front_init"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "timer_elapsed", secs = 1.0 }
actions = [
    { type = "play_cutscene", cutscene_id = "intro_flyover" },
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "active" },
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "active" },
    { type = "set_objective_status", objective_id = "obj_bonus_waves", status = "active" },
    { type = "set_variable", name = "mission_stage", value = 1 },
    { type = "reveal_area", tile = [74, 22], radius = 9 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Repel the Korean amphibious invasion at Vladivostok with Typhoon Submarines and Rhino Tanks, and destroy the enemy island staging base.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "battle_control_online" },
]

[[trigger_zones]]
id = "ra2_soviet_04_home_front_reinforcements"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all", conditions = [{ type = "timer_elapsed", secs = 55.0 }, { type = "variable_equals", name = "mission_stage", value = 1 }] }
actions = [
    { type = "play_radar_video", video_path = "assets/videos/radar_pip/soviet_04_pip_02.mp4" },
    { type = "set_variable", name = "mission_stage", value = 2 },
    { type = "grant_credits", player_id = 1, amount = 2000 },
    { type = "spawn_reinforcements", player_id = 1, unit_id = "rhino_tank", count = 3, tile = [29, 59] },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Command reserves and emergency war funds have arrived at your base!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "reinforcements_have_arrived", radar_video = "assets/videos/radar_pip/soviet_04_pip_02.mp4" },
]

[[trigger_zones]]
id = "ra2_soviet_04_home_front_victory"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "all_buildings_destroyed", player_id = 2 }
actions = [
    { type = "set_objective_status", objective_id = "obj_primary_main", status = "completed" },
    { type = "set_variable", name = "mission_stage", value = 3 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "All enemy structures neutralized. Mission accomplished, Commander!", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "primary_objective_achieved" },
    { type = "declare_winner", player_id = 1 },
]

[[trigger_zones]]
id = "p22_tech_comms_captured"
min = [0, 0]
max = [3, 3]
once = true
condition = { type = "building_captured", building_id = "tech_communications_center", by_player_id = 1 }
actions = [
    { type = "set_objective_status", objective_id = "obj_capture_comms", status = "completed" },
    { type = "grant_credits", player_id = 1, amount = 1000 },
    { type = "reveal_area_for_player", player_id = 1, center = [149.0, 0.0, 45.0], radius = 24.0, duration_secs = 45 },
    { type = "eva_transmission", speaker = "LT. ZOFIA", text = "Tech Communications Center online! Satellite radar sweep active.", portrait = "assets/ui/cameos/nradicon.png", audio_cue = "building_captured" },
]

[[trigger_zones]]
id = "p22_periodic_skirmish_wave"
min = [0, 0]
max = [3, 3]
once = false
condition = { type = "periodic_timer", start_secs = 75, interval_secs = 75, max_repeats = 3 }
actions = [
    { type = "spawn_reinforcements", player_id = 2, unit_id = "allied_gi", count = 3, tile = [72, 20] },
    { type = "add_objective_progress", objective_id = "obj_bonus_waves", delta = 1 },
]
