    { type = "eva_transmission", speaker = "LT. EVA", text = "Destroy the Soviet Psychic Beacon in St. Louis and lead Professor Einstein's new Prism Tanks across the Mississippi River to crush all Soviet forces.", portrait = "assets/ui/cameos/asaticon.png", audio_cue = "battle_control_online" },
]

