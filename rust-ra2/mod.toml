id = "rust-ra2"
name = "Red Alert 2: Rust Total Conversion"
version = "0.1.0"
authors = ["Rust-RTS Team"]
description = "Modern 3D total conversion mod inspired by Command & Conquer: Red Alert 2"
engine_version = "0.1.0"
entry_map = "maps/skirmish_valley.toml"
scripts = [
    "scripts/allied_rules.rhai",
    "scripts/soviet_rules.lua",
]

[catalogs]
factions = "factions/factions.toml"
weapons = "weapons/weapons.toml"
buildings = "buildings/buildings.toml"
units = "units/units.toml"
upgrades = "upgrades/upgrades.toml"
campaigns = "campaigns/campaigns.toml"
ai_profiles = "ai/ai_profiles.toml"
audio = "audio/audio.toml"
locales_dir = "locales"

[rules]
veteran_xp_threshold = 220.0
elite_xp_threshold = 550.0
commander_rank_xp_thresholds = [150.0, 500.0, 1100.0, 2000.0]
sell_refund_ratio = 0.50
building_repair_hp_per_sec = 28.0
building_repair_credits_per_cycle = 2
low_power_speed_factor = 0.50
crate_spawn_interval_ticks = 600
crate_max_active = 8
default_liberated_worker_unit = "soviet_conscript"
default_mutant_unit = "yuri_brute"

[rules.free_unit_by_faction]
allies = "grizzly_tank"
soviets = "rhino_tank"
yuri = "lasher_tank"

[rules.default_infantry_by_faction]
allies = "allied_gi"
soviets = "soviet_conscript"
yuri = "yuri_initiate"

[rules.stolen_tech_commando_by_pair]
"allies:soviets" = "chrono_ivan"
"soviets:soviets" = "yuri_prime"
"*:allies" = "chrono_commando"
"*:yuri" = "psi_commando"
"*:soviets" = "chrono_ivan"

