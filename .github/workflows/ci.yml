name: IRONLOCK // RUST-RTS CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-workspace:
    name: Rust Engine (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: debian-deb
            label: "Debian (.deb)"
            runner: ubuntu-latest
            pkg_format: deb
          - target_id: redhat-rpm
            label: "RedHat (.rpm)"
            runner: ubuntu-latest
            pkg_format: rpm
          - target_id: windows
            label: "Windows (x86_64)"
            runner: windows-latest
            pkg_format: zip
          - target_id: macos
            label: "macOS (ARM64)"
            runner: macos-latest
            pkg_format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system & packaging libraries (ALSA / X11 / Wayland / DEB / RPM)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            dpkg-dev \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: ${{ matrix.target_id }}

      - name: Cargo Format Check (rustfmt)
        if: matrix.target_id == 'debian-deb'
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check

      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Cargo Test (workspace)
        run: cargo test --manifest-path engine/Cargo.toml --workspace

      - name: Cargo Test rts-simulation (--release determinism & 1,200-unit scale gate)
        run: cargo test --manifest-path engine/Cargo.toml -p rts-simulation --release

      - name: Deep Binary & Schema Validate Mods (rust-ra2 & sdk-showcase-workers-squads)
        if: matrix.target_id == 'debian-deb'
        run: |
          cargo run --manifest-path engine/Cargo.toml -p rts-asset-pipeline -- validate --mod-path rust-ra2
          cargo run --manifest-path engine/Cargo.toml -p rts-asset-pipeline -- validate --mod-path mods/sdk-showcase-workers-squads

      - name: Run Declarative Gameplay Scenario Suites (test-mod)
        if: matrix.target_id == 'debian-deb'
        run: |
          cargo run --manifest-path engine/Cargo.toml -p rts-asset-pipeline -- test-mod --mod-path rust-ra2
          cargo run --manifest-path engine/Cargo.toml -p rts-asset-pipeline -- test-mod --mod-path mods/sdk-showcase-workers-squads

      - name: Build & Verify Debian (.deb) Package
        if: matrix.target_id == 'debian-deb'
        run: |
          cargo build --manifest-path engine/Cargo.toml -p rts-client -p rts-asset-pipeline
          ./engine/target/debug/rts-asset-pipeline cook-standalone --mod-path mods/sdk-showcase-workers-squads --output-dir dist/ironlock-sdk-showcase --lock-player-mode
          cp engine/target/debug/rts-client dist/ironlock-sdk-showcase/rts-client
          bash ./scripts/package_linux.sh deb ironlock-sdk-showcase 0.2.0 dist/ironlock-sdk-showcase dist/packages

      - name: Build & Verify RedHat (.rpm) Package
        if: matrix.target_id == 'redhat-rpm'
        run: |
          cargo build --manifest-path engine/Cargo.toml -p rts-client -p rts-asset-pipeline
          ./engine/target/debug/rts-asset-pipeline cook-standalone --mod-path mods/sdk-showcase-workers-squads --output-dir dist/ironlock-sdk-showcase --lock-player-mode
          cp engine/target/debug/rts-client dist/ironlock-sdk-showcase/rts-client
          bash ./scripts/package_linux.sh rpm ironlock-sdk-showcase 0.2.0 dist/ironlock-sdk-showcase dist/packages

  centralwebserver:
    name: Central Webserver & NS8 Module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: centralwebserver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build server & browser TypeScript bundles
        run: npm run build

      - name: Run unit & integration tests
        run: npm test

      - name: Validate NethServer 8 module & SemVer rules
        run: python3 scripts/validate_ns8_module.py
